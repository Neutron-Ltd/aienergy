<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in — AI Energy / 智能能源</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Space Grotesk', sans-serif; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        .login-bg {
            background: linear-gradient(135deg, #f8fafc 0%, #eef2ff 45%, #e0e7ff 100%);
        }
        @keyframes cardIn {
            from { opacity: 0; transform: translateY(12px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .login-card { animation: cardIn 0.5s ease-out forwards; }
    </style>
</head>
<body class="login-bg min-h-screen flex items-center justify-center p-6">
    <div class="w-full max-w-md login-card">
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-indigo-600 text-white shadow-lg shadow-indigo-300/50 mb-4">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
            </div>
            <h1 class="text-2xl font-bold font-mono text-slate-900 tracking-tight">ML Energy</h1>
            <p class="text-sm text-slate-500 mt-1">机器学习能源 · Dashboard</p>
        </div>

        <div class="bg-white rounded-2xl shadow-xl shadow-slate-200/60 border border-slate-200/80 p-8">
            <h2 class="text-lg font-semibold text-slate-800 mb-1">Sign in / 登录</h2>
            <p class="text-xs text-slate-500 mb-6">Enter your credentials to continue</p>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="mb-4 px-4 py-3 rounded-lg text-sm {% if category == 'error' %}bg-rose-50 text-rose-700 border border-rose-200{% else %}bg-slate-50 text-slate-700 border border-slate-200{% endif %}">
                            {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form method="post" action="{{ url_for('login') }}" class="space-y-5">
                <input type="hidden" name="next" value="{{ next or '' }}">
                <div>
                    <label for="username" class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">Username / 用户名</label>
                    <input type="text" id="username" name="username" required autocomplete="username"
                        class="w-full px-4 py-3 rounded-xl border border-slate-200 bg-slate-50/50 text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-400 transition-shadow"
                        placeholder="aienergy" autofocus>
                </div>
                <div>
                    <label for="password" class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">Password / 密码</label>
                    <input type="password" id="password" name="password" required autocomplete="current-password"
                        class="w-full px-4 py-3 rounded-xl border border-slate-200 bg-slate-50/50 text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-400 transition-shadow"
                        placeholder="••••••••••••">
                </div>
                <button type="submit"
                    class="w-full py-3.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-sm shadow-md shadow-indigo-200 transition-colors">
                    Continue / 继续
                </button>
            </form>
        </div>

        <p class="text-center text-[11px] text-slate-400 mt-6">ML Energy Management · Secure access</p>
    </div>
</body>
</html>

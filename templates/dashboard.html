<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ML Energy / 机器学习能源</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        mono: ['JetBrains Mono', 'monospace'],
                        sans: ['Space Grotesk', 'sans-serif'],
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.45s ease-out',
                        'slide-up': 'slideUp 0.35s ease-out',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' },
                        },
                        slideUp: {
                            '0%': { opacity: '0', transform: 'translateY(8px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        },
                    },
                },
            },
        }
    </script>
    <style>
        body { font-family: 'Space Grotesk', sans-serif; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        .bilingual .zh { font-size: 0.75em; opacity: 0.8; margin-top: 1px; }
        .sidebar-item { transition: all 0.2s ease; }
        .sidebar-item:hover { background: rgba(99, 102, 241, 0.08); transform: translateX(2px); }
        .sidebar-item.active { background: linear-gradient(90deg, rgba(99, 102, 241, 0.12), transparent); border-left: 3px solid #6366f1; }
        .sidebar-subitem { transition: background 0.15s ease, border-color 0.15s ease; border-left: 3px solid transparent; }
        .sidebar-subitem:hover { background: rgba(99, 102, 241, 0.06); }
        .sidebar-subitem.active { background: rgba(99, 102, 241, 0.1); border-left-color: #6366f1; }
        #meters-section.expanded .meters-chevron { transform: rotate(90deg); }
        #meters-section.meters-active > #meters-toggle { background: rgba(99, 102, 241, 0.06); }
        #report-frame { min-height: 600px; transition: opacity 0.3s ease; }
        #report-frame.loading { opacity: 0.55; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .fade-in { animation: fadeIn 0.45s ease-out forwards; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen overflow-hidden">
    <div class="flex h-screen">
        <!-- Left Sidebar — light -->
        <aside class="w-60 flex-shrink-0 bg-white border-r border-slate-200 shadow-sm flex flex-col animate-fade-in">
            <div class="p-5 border-b border-slate-100">
                <h1 class="text-lg font-bold font-mono text-indigo-600 tracking-tight">AI Energy</h1>
                <p class="text-xs text-slate-500 mt-0.5">机器学习能源</p>
            </div>
            <nav class="flex-1 p-3 space-y-1 overflow-y-auto">
                <button type="button" data-type="grid" class="sidebar-item nav-top w-full text-left px-4 py-3 rounded-lg flex items-center gap-3">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 shrink-0"></span>
                    <div class="bilingual">
                        <span class="en font-semibold text-slate-800">Grid</span>
                        <span class="zh text-slate-500">电网</span>
                    </div>
                </button>
                <button type="button" data-type="solar" class="sidebar-item nav-top w-full text-left px-4 py-3 rounded-lg flex items-center gap-3">
                    <span class="w-2 h-2 rounded-full bg-amber-400 shrink-0"></span>
                    <div class="bilingual">
                        <span class="en font-semibold text-slate-800">Solar</span>
                        <span class="zh text-slate-500">太阳能</span>
                    </div>
                </button>

                <!-- Meters: expandable nav (chevron) -->
                <div id="meters-section" class="rounded-lg overflow-hidden">
                    <button type="button" id="meters-toggle" class="sidebar-item w-full text-left px-4 py-3 rounded-lg flex items-center justify-between gap-2 group" aria-expanded="false" aria-controls="meters-children">
                        <span class="flex items-center gap-3 min-w-0">
                            <span class="w-2 h-2 rounded-full bg-indigo-400 shrink-0"></span>
                            <div class="bilingual min-w-0">
                                <span class="en font-semibold text-slate-800">Meters</span>
                                <span class="zh text-slate-500">电表</span>
                            </div>
                        </span>
                        <svg class="meters-chevron w-4 h-4 text-slate-400 shrink-0 transition-transform duration-200 ease-out" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
                        </svg>
                    </button>
                    <div id="meters-children" class="hidden mt-3 pb-1" role="region" aria-label="Meters reports / 电表报告">
                        <div class="ml-3 pl-3 border-l-2 border-slate-200 space-y-0.5">
                            <button type="button" class="meters-child sidebar-subitem w-full text-left px-3 py-2.5 rounded-md text-sm" data-type="meters_matrix">
                                <span class="font-medium text-slate-800">Meters / 矩阵</span>
                            </button>
                            <button type="button" class="meters-child sidebar-subitem w-full text-left px-3 py-2.5 rounded-md text-sm" data-type="meters_data">
                                <span class="font-medium text-slate-800">Data / 数据</span>
                            </button>
                            <button type="button" class="meters-child sidebar-subitem w-full text-left px-3 py-2.5 rounded-md text-sm" data-type="meters_use">
                                <span class="font-medium text-slate-800">Use / 用电</span>
                            </button>
                            <button type="button" class="meters-child sidebar-subitem w-full text-left px-3 py-2.5 rounded-md text-sm" data-type="meters_ai">
                                <span class="font-medium text-slate-800">ML / 预测</span>
                            </button>
                        </div>
                    </div>
                </div>

                <button type="button" data-type="report" class="sidebar-item nav-top w-full text-left px-4 py-3 rounded-lg flex items-center gap-3">
                    <span class="w-2 h-2 rounded-full bg-indigo-500 shrink-0"></span>
                    <div class="bilingual">
                        <span class="en font-semibold text-slate-800">Report</span>
                        <span class="zh text-slate-500">报告</span>
                    </div>
                </button>
                <a href="/ai-imputer" class="sidebar-item w-full text-left px-4 py-3 rounded-lg flex items-center gap-3">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 shrink-0"></span>
                    <div class="bilingual">
                        <span class="en font-semibold text-slate-800">ML Model</span>
                        <span class="zh text-slate-500">ML 模型</span>
                    </div>
                </a>
            </nav>
        </aside>

        <!-- Main -->
        <main class="flex-1 flex flex-col min-w-0 overflow-hidden bg-slate-50">
            <header class="bg-white border-b border-slate-200 px-6 py-4 flex flex-wrap items-center gap-4 shadow-sm animate-slide-up">
                <div class="flex items-center gap-2">
                    <label class="text-xs font-semibold text-slate-500 uppercase tracking-wider">
                        <span class="en">History</span> <span class="text-slate-400">/</span> <span class="zh">历史</span>
                    </label>
                    <select id="history-select" class="bg-white border border-slate-200 rounded-lg px-3 py-2 text-sm font-mono text-slate-800 min-w-[200px] focus:outline-none focus:ring-2 focus:ring-indigo-400">
                        <option value="">-- Select / 选择 --</option>
                    </select>
                </div>
                <div class="flex items-center gap-2">
                    <label class="text-xs font-semibold text-slate-500 uppercase tracking-wider">
                        <span class="en">Start</span> <span class="text-slate-400">/</span> <span class="zh">开始</span>
                    </label>
                    <input type="date" id="start-date" value="2026-03-01"
                        class="bg-white border border-slate-200 rounded-lg px-3 py-2 text-sm font-mono w-40 focus:outline-none focus:ring-2 focus:ring-indigo-400">
                </div>
                <div id="days-wrap" class="flex items-center gap-2">
                    <label class="text-xs font-semibold text-slate-500 uppercase tracking-wider">
                        <span class="en">Days</span> <span class="text-slate-400">/</span> <span class="zh">天数</span>
                    </label>
                    <input type="number" id="days-input" min="1" max="30" value="7"
                        class="bg-white border border-slate-200 rounded-lg px-3 py-2 text-sm font-mono w-16 focus:outline-none focus:ring-2 focus:ring-indigo-400">
                </div>
                <div id="ai-model-wrap" class="hidden items-center gap-2">
                    <label class="text-xs font-semibold text-slate-500 uppercase tracking-wider">
                        <span class="en">Model Dir</span> <span class="text-slate-400">/</span> <span class="zh">模型目录</span>
                    </label>
                    <input type="text" id="ai-model-dir" value="model_artifacts"
                        class="bg-white border border-slate-200 rounded-lg px-3 py-2 text-sm font-mono w-56 focus:outline-none focus:ring-2 focus:ring-indigo-400"
                        placeholder="model_artifacts">
                </div>
                <button id="analyze-btn" type="button"
                    class="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-sm rounded-lg shadow-md shadow-indigo-200 transition-colors flex items-center gap-2">
                    <span class="en">Analyze</span> <span class="zh opacity-90">分析</span>
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
                </button>
                <span id="status-msg" class="text-sm text-slate-500 ml-1 flex-1 min-w-[8rem]"></span>
                <form method="post" action="/logout" class="ml-auto shrink-0">
                    <button type="submit" class="text-xs font-semibold text-slate-500 hover:text-indigo-600 px-3 py-2 rounded-lg border border-slate-200 hover:border-indigo-200 bg-white transition-colors">
                        Log out / 退出
                    </button>
                </form>
            </header>

            <div class="flex-1 overflow-hidden p-4">
                <div id="report-container" class="h-full rounded-xl overflow-hidden bg-white border border-slate-200 shadow-sm relative">
                    <iframe id="report-frame" src="about:blank" class="w-full h-full bg-slate-100" title="Report"></iframe>
                    <div id="empty-state" class="absolute inset-0 flex flex-col items-center justify-center text-slate-500 p-8 pointer-events-none bg-slate-50/90">
                        <svg class="w-14 h-14 text-slate-300 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/>
                        </svg>
                        <p class="text-slate-600 font-medium text-center">
                            <span class="en">Select from history or analyze</span><br>
                            <span class="zh text-sm text-slate-500 mt-1 inline-block">从历史选择或点击分析</span>
                        </p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        let currentType = 'grid';
        const reportFrame = document.getElementById('report-frame');
        const historySelect = document.getElementById('history-select');
        const startDate = document.getElementById('start-date');
        const daysInput = document.getElementById('days-input');
        const daysWrap = document.getElementById('days-wrap');
        const aiModelWrap = document.getElementById('ai-model-wrap');
        const aiModelDir = document.getElementById('ai-model-dir');
        const analyzeBtn = document.getElementById('analyze-btn');
        const statusMsg = document.getElementById('status-msg');
        const emptyState = document.getElementById('empty-state');
        const metersSection = document.getElementById('meters-section');
        const metersToggle = document.getElementById('meters-toggle');
        const metersChildren = document.getElementById('meters-children');
        const metersChildButtons = document.querySelectorAll('.meters-child');

        function isMetersType(t) {
            return t && t.startsWith('meters_');
        }

        function setMetersExpanded(open) {
            metersToggle.setAttribute('aria-expanded', open ? 'true' : 'false');
            if (open) {
                metersSection.classList.add('expanded');
                metersChildren.classList.remove('hidden');
            } else {
                metersSection.classList.remove('expanded');
                metersChildren.classList.add('hidden');
            }
        }

        function collapseMetersGroup() {
            setMetersExpanded(false);
            metersSection.classList.remove('meters-active');
            metersChildButtons.forEach(b => b.classList.remove('active'));
        }

        function syncMetersChildActive() {
            metersChildButtons.forEach(b => {
                b.classList.toggle('active', b.dataset.type === currentType);
            });
            metersSection.classList.toggle('meters-active', isMetersType(currentType));
        }

        function selectMetersChild(type) {
            clearTopNavActive();
            currentType = type;
            setMetersExpanded(true);
            syncMetersChildActive();
            updateDaysVisibility();
            loadReport(null);
            fetchHistory();
            historySelect.value = '';
        }

        function setStatus(msg, isError = false) {
            statusMsg.textContent = msg;
            statusMsg.className = 'text-sm ml-1 ' + (isError ? 'text-rose-600' : 'text-slate-500');
        }

        function updateDaysVisibility() {
            const singleDay = currentType === 'meters_matrix';
            if (singleDay) {
                daysWrap.classList.add('opacity-40', 'pointer-events-none');
                daysWrap.title = 'Single-day report / 单日报告 — Days not used';
                daysInput.value = 1;
            } else {
                daysWrap.classList.remove('opacity-40', 'pointer-events-none');
                daysWrap.title = '';
            }
            if (currentType === 'meters_ai') {
                aiModelWrap.classList.remove('hidden');
                aiModelWrap.classList.add('flex');
            } else {
                aiModelWrap.classList.add('hidden');
                aiModelWrap.classList.remove('flex');
            }
        }

        function clearTopNavActive() {
            document.querySelectorAll('.nav-top').forEach(b => b.classList.remove('active'));
        }

        function setLoading(loading) {
            analyzeBtn.disabled = loading;
            reportFrame.classList.toggle('loading', loading);
            if (loading) {
                analyzeBtn.innerHTML = '<span class="en">Analyzing...</span> <span class="zh opacity-90">分析中...</span> <svg class="animate-spin w-4 h-4 inline" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>';
            } else {
                analyzeBtn.innerHTML = '<span class="en">Analyze</span> <span class="zh opacity-90">分析</span> <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>';
            }
        }

        function loadReport(path) {
            if (!path) {
                reportFrame.src = 'about:blank';
                emptyState.style.display = 'flex';
                return;
            }
            emptyState.style.display = 'none';
            reportFrame.src = '/reports/' + path;
        }

        function redirectIfUnauthorized(res) {
            if (res.status === 401) {
                window.location.href = '/login';
                return true;
            }
            return false;
        }

        async function fetchHistory() {
            try {
                const res = await fetch('/api/history?type=' + encodeURIComponent(currentType));
                if (redirectIfUnauthorized(res)) return;
                const data = await res.json();
                const hist = data.history || [];
                historySelect.innerHTML = '<option value="">-- Select / 选择 --</option>' +
                    hist.map(h => `<option value="${h.path}">${h.label}</option>`).join('');
            } catch (e) {
                setStatus('Failed to load history', true);
            }
        }

        async function runAnalyze() {
            const startValue = startDate.value.trim();
            const dateMatch = startValue.match(/^(\d{4})-(\d{2})-(\d{2})$/);
            const start = dateMatch ? dateMatch[1].slice(2) + dateMatch[2] + dateMatch[3] : '';
            let days = parseInt(daysInput.value, 10) || 7;
            if (currentType === 'meters_matrix') days = 1;
            if (!start) {
                setStatus('Please select a valid start date', true);
                return;
            }
            setLoading(true);
            setStatus('');
            try {
                const payload = { type: currentType, start, days };
                if (currentType === 'meters_ai') {
                    payload.model_dir = aiModelDir.value.trim() || 'model_artifacts';
                }
                const res = await fetch('/api/analyze', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload),
                });
                if (redirectIfUnauthorized(res)) return;
                const data = await res.json();
                if (data.success) {
                    setStatus('Done / 完成');
                    loadReport(data.path);
                    await fetchHistory();
                    const opt = Array.from(historySelect.options).find(o => o.value === data.path);
                    if (opt) historySelect.value = data.path;
                } else {
                    setStatus(data.error || 'Analysis failed', true);
                }
            } catch (e) {
                setStatus('Network error: ' + e.message, true);
            } finally {
                setLoading(false);
            }
        }

        document.querySelectorAll('.nav-top[data-type]').forEach(btn => {
            btn.addEventListener('click', () => {
                collapseMetersGroup();
                clearTopNavActive();
                btn.classList.add('active');
                currentType = btn.dataset.type;
                updateDaysVisibility();
                loadReport(null);
                fetchHistory();
                historySelect.value = '';
            });
        });

        metersToggle.addEventListener('click', (e) => {
            e.stopPropagation();
            const willOpen = metersChildren.classList.contains('hidden');
            if (willOpen) {
                setMetersExpanded(true);
                if (!isMetersType(currentType)) {
                    selectMetersChild('meters_use');
                    return;
                }
                syncMetersChildActive();
            } else {
                setMetersExpanded(false);
            }
        });

        metersChildButtons.forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                selectMetersChild(btn.dataset.type);
            });
        });

        document.querySelector('.nav-top[data-type="grid"]').classList.add('active');

        historySelect.addEventListener('change', () => {
            const path = historySelect.value;
            if (path) loadReport(path);
            else loadReport(null);
        });

        analyzeBtn.addEventListener('click', runAnalyze);

        updateDaysVisibility();
        fetchHistory();
    </script>
</body>
</html>

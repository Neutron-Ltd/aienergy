<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Energy / 智能能源</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        mono: ['JetBrains Mono', 'monospace'],
                        sans: ['Space Grotesk', 'sans-serif'],
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.5s ease-out',
                        'slide-up': 'slideUp 0.4s ease-out',
                        'pulse-glow': 'pulseGlow 2s ease-in-out infinite',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' },
                        },
                        slideUp: {
                            '0%': { opacity: '0', transform: 'translateY(10px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        },
                        pulseGlow: {
                            '0%, 100%': { boxShadow: '0 0 20px rgba(34, 211, 238, 0.3)' },
                            '50%': { boxShadow: '0 0 40px rgba(34, 211, 238, 0.6)' },
                        },
                    },
                },
            },
        }
    </script>
    <style>
        body { font-family: 'Space Grotesk', sans-serif; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        .bilingual { display: flex; flex-direction: column; align-items: flex-start; gap: 0; }
        .bilingual .en { font-size: 0.95em; font-weight: 600; }
        .bilingual .zh { font-size: 0.75em; opacity: 0.85; margin-top: 1px; }
        .sidebar-item { transition: all 0.2s ease; }
        .sidebar-item:hover { background: rgba(34, 211, 238, 0.1); transform: translateX(4px); }
        .sidebar-item.active { background: linear-gradient(90deg, rgba(34, 211, 238, 0.2), transparent); border-left: 3px solid #22d3ee; }
        .glass { background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(148, 163, 184, 0.15); }
        .grid-bg { background-image: linear-gradient(rgba(34, 211, 238, 0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(34, 211, 238, 0.03) 1px, transparent 1px); background-size: 24px 24px; }
        #report-frame { min-height: 600px; transition: opacity 0.3s ease; }
        #report-frame.loading { opacity: 0.5; }
        .btn-analyze:hover { animation: pulseGlow 1.5s ease-in-out infinite; }
        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 0 20px rgba(34, 211, 238, 0.4); }
            50% { box-shadow: 0 0 35px rgba(34, 211, 238, 0.7); }
        }
        .fade-in { animation: fadeIn 0.5s ease-out forwards; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen grid-bg overflow-hidden">
    <div class="flex h-screen">
        <!-- Left Sidebar -->
        <aside class="w-56 flex-shrink-0 glass border-r border-slate-700/50 flex flex-col animate-fade-in">
            <div class="p-6 border-b border-slate-700/50">
                <h1 class="text-xl font-bold font-mono text-cyan-400 tracking-tight">AI Energy</h1>
                <p class="text-xs text-slate-400 mt-0.5">智能能源</p>
            </div>
            <nav class="flex-1 p-3 space-y-1">
                <button data-type="grid" class="sidebar-item w-full text-left px-4 py-3 rounded-lg flex items-center gap-3" type="button">
                    <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
                    <div class="bilingual">
                        <span class="en">Grid</span>
                        <span class="zh text-slate-400">电网</span>
                    </div>
                </button>
                <button data-type="solar" class="sidebar-item w-full text-left px-4 py-3 rounded-lg flex items-center gap-3" type="button">
                    <span class="w-2 h-2 rounded-full bg-amber-400"></span>
                    <div class="bilingual">
                        <span class="en">Solar</span>
                        <span class="zh text-slate-400">太阳能</span>
                    </div>
                </button>
                <button data-type="meters" class="sidebar-item w-full text-left px-4 py-3 rounded-lg flex items-center gap-3" type="button">
                    <span class="w-2 h-2 rounded-full bg-indigo-400"></span>
                    <div class="bilingual">
                        <span class="en">Meters</span>
                        <span class="zh text-slate-400">电表</span>
                    </div>
                </button>
                <button data-type="report" class="sidebar-item w-full text-left px-4 py-3 rounded-lg flex items-center gap-3" type="button">
                    <span class="w-2 h-2 rounded-full bg-cyan-400"></span>
                    <div class="bilingual">
                        <span class="en">Report</span>
                        <span class="zh text-slate-400">报告</span>
                    </div>
                </button>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 flex flex-col min-w-0 overflow-hidden">
            <!-- Top Bar -->
            <header class="glass border-b border-slate-700/50 px-6 py-4 flex flex-wrap items-center gap-4 animate-slide-up">
                <div class="flex items-center gap-2">
                    <label class="text-xs font-semibold text-slate-400 uppercase tracking-wider">
                        <span class="en">History</span> <span class="text-slate-500">/</span> <span class="zh">历史</span>
                    </label>
                    <select id="history-select" class="bg-slate-800/80 border border-slate-600 rounded-lg px-3 py-2 text-sm font-mono text-cyan-100 focus:outline-none focus:ring-2 focus:ring-cyan-500/50 min-w-[180px]">
                        <option value="">-- Select / 选择 --</option>
                    </select>
                </div>
                <div class="flex items-center gap-2">
                    <label class="text-xs font-semibold text-slate-400 uppercase tracking-wider">
                        <span class="en">Start</span> <span class="text-slate-500">/</span> <span class="zh">开始</span>
                    </label>
                    <input type="text" id="start-date" placeholder="YYMMDD" value="260301"
                        class="bg-slate-800/80 border border-slate-600 rounded-lg px-3 py-2 text-sm font-mono w-24 focus:outline-none focus:ring-2 focus:ring-cyan-500/50">
                </div>
                <div class="flex items-center gap-2">
                    <label class="text-xs font-semibold text-slate-400 uppercase tracking-wider">
                        <span class="en">Days</span> <span class="text-slate-500">/</span> <span class="zh">天数</span>
                    </label>
                    <input type="number" id="days-input" min="1" max="30" value="7"
                        class="bg-slate-800/80 border border-slate-600 rounded-lg px-3 py-2 text-sm font-mono w-16 focus:outline-none focus:ring-2 focus:ring-cyan-500/50">
                </div>
                <button id="analyze-btn" type="button"
                    class="btn-analyze px-5 py-2.5 bg-gradient-to-r from-cyan-500 to-cyan-600 hover:from-cyan-400 hover:to-cyan-500 text-slate-950 font-bold text-sm rounded-lg shadow-lg shadow-cyan-500/25 transition-all flex items-center gap-2">
                    <span class="en">Analyze</span> <span class="zh">分析</span>
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
                </button>
                <span id="status-msg" class="text-sm text-slate-500 ml-2"></span>
            </header>

            <!-- Report Frame -->
            <div class="flex-1 overflow-hidden p-4">
                <div id="report-container" class="h-full rounded-xl overflow-hidden glass border border-slate-700/50 relative">
                    <iframe id="report-frame" src="about:blank" class="w-full h-full bg-slate-100" title="Report"></iframe>
                    <div id="empty-state" class="absolute inset-0 flex flex-col items-center justify-center text-slate-500 p-8 pointer-events-none">
                        <svg class="w-16 h-16 text-slate-600 mb-4 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/>
                        </svg>
                        <p class="text-slate-400 font-medium">
                            <span class="en">Select from history or analyze a date range</span>
                            <span class="zh block text-sm mt-1">从历史选择或分析日期范围</span>
                        </p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        let currentType = 'grid';
        const reportFrame = document.getElementById('report-frame');
        const historySelect = document.getElementById('history-select');
        const startDate = document.getElementById('start-date');
        const daysInput = document.getElementById('days-input');
        const analyzeBtn = document.getElementById('analyze-btn');
        const statusMsg = document.getElementById('status-msg');
        const emptyState = document.getElementById('empty-state');

        function setStatus(msg, isError = false) {
            statusMsg.textContent = msg;
            statusMsg.className = 'text-sm ml-2 ' + (isError ? 'text-rose-400' : 'text-slate-500');
        }

        function setLoading(loading) {
            analyzeBtn.disabled = loading;
            reportFrame.classList.toggle('loading', loading);
            if (loading) {
                analyzeBtn.innerHTML = '<span class="en">Analyzing...</span> <span class="zh">分析中...</span> <svg class="animate-spin w-4 h-4" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>';
            } else {
                analyzeBtn.innerHTML = '<span class="en">Analyze</span> <span class="zh">分析</span> <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>';
            }
        }

        function loadReport(path) {
            if (!path) {
                reportFrame.src = 'about:blank';
                emptyState.style.display = 'flex';
                return;
            }
            emptyState.style.display = 'none';
            reportFrame.src = '/reports/' + path;
        }

        async function fetchHistory() {
            try {
                const res = await fetch('/api/history?type=' + currentType);
                const data = await res.json();
                const hist = data.history || [];
                historySelect.innerHTML = '<option value="">-- Select / 选择 --</option>' +
                    hist.map(h => `<option value="${h.path}">${h.label}</option>`).join('');
            } catch (e) {
                setStatus('Failed to load history', true);
            }
        }

        async function runAnalyze() {
            const start = startDate.value.trim();
            const days = parseInt(daysInput.value, 10) || 7;
            if (!start || start.length !== 6) {
                setStatus('Invalid start date (use YYMMDD)', true);
                return;
            }
            setLoading(true);
            setStatus('');
            try {
                const res = await fetch('/api/analyze', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ type: currentType, start, days }),
                });
                const data = await res.json();
                if (data.success) {
                    setStatus('Done');
                    loadReport(data.path);
                    await fetchHistory();
                    const opt = Array.from(historySelect.options).find(o => o.value === data.path);
                    if (opt) historySelect.value = data.path;
                } else {
                    setStatus(data.error || 'Analysis failed', true);
                }
            } catch (e) {
                setStatus('Network error: ' + e.message, true);
            } finally {
                setLoading(false);
            }
        }

        // Sidebar navigation
        document.querySelectorAll('.sidebar-item[data-type]').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.sidebar-item').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentType = btn.dataset.type;
                loadReport(null);
                fetchHistory();
                historySelect.value = '';
            });
        });

        // Set initial active state
        document.querySelector('.sidebar-item[data-type="grid"]').classList.add('active');

        // History select change
        historySelect.addEventListener('change', () => {
            const path = historySelect.value;
            if (path) loadReport(path);
            else loadReport(null);
        });

        // Analyze button
        analyzeBtn.addEventListener('click', runAnalyze);

        // Initial load
        fetchHistory();
    </script>
</body>
</html>

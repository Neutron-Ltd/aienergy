<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ML Energy{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Space Grotesk', sans-serif; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        .bilingual .zh { font-size: 0.75em; opacity: 0.8; margin-top: 1px; }
        .sidebar-item { transition: all 0.2s ease; }
        .sidebar-item:hover { background: rgba(99, 102, 241, 0.08); transform: translateX(2px); }
        .sidebar-item.active { background: linear-gradient(90deg, rgba(16, 185, 129, 0.14), transparent); border-left: 3px solid #10b981; }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen overflow-hidden">
    <div class="flex h-screen">
        <aside class="w-60 flex-shrink-0 bg-white border-r border-slate-200 shadow-sm flex flex-col">
            <div class="p-5 border-b border-slate-100">
                <h1 class="text-lg font-bold font-mono text-indigo-600 tracking-tight">AI Energy</h1>
                <p class="text-xs text-slate-500 mt-0.5">机器学习能源</p>
            </div>
            <nav class="flex-1 p-3 space-y-1 overflow-y-auto">
                <a href="/" class="sidebar-item w-full text-left px-4 py-3 rounded-lg flex items-center gap-3 {% block nav_dashboard_active %}{% endblock %}">
                    <span class="w-2 h-2 rounded-full bg-indigo-500 shrink-0"></span>
                    <div class="bilingual">
                        <span class="en font-semibold text-slate-800">Dashboard</span>
                        <span class="zh text-slate-500">总览</span>
                    </div>
                </a>
                <a href="/ai-imputer" class="sidebar-item w-full text-left px-4 py-3 rounded-lg flex items-center gap-3 {% block nav_ai_model_active %}{% endblock %}">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 shrink-0"></span>
                    <div class="bilingual">
                        <span class="en font-semibold text-slate-800">ML Model</span>
                        <span class="zh text-slate-500">ML 模型</span>
                    </div>
                </a>
            </nav>
        </aside>

        <main class="flex-1 min-w-0 overflow-y-auto p-6">
            {% block page_content %}{% endblock %}
        </main>
    </div>
    {% block page_scripts %}{% endblock %}
</body>
</html>

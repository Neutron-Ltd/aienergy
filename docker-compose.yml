services:
  web:
    build: .
    user: "0:0"
    ports:
      - "${HOST_PORT:-5050}:5050"
    environment:
      PORT: "5050"
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY:?Set FLASK_SECRET_KEY in .env}
      AIENERGY_USER: ${AIENERGY_USER:-aienergy}
      AIENERGY_PASSWORD: ${AIENERGY_PASSWORD:?Set AIENERGY_PASSWORD in .env}
      MYSQL_HOST: ${MYSQL_HOST:-host.docker.internal}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_USER: ${MYSQL_USER:-energy_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-unified}
      TABLE_PREFIX: ${TABLE_PREFIX:-site}
      MODEL_ARTIFACT_DIR: /app/LinearRegression
    volumes:
      - ./LinearRegression:/app/LinearRegression
      - ./nodes/data:/app/nodes/data
      - ./relation.json:/app/relation.json:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: >
      sh -c "mkdir -p /app/LinearRegression &&
             python dashboard.py"
